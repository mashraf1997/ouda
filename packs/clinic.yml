# Ouda (Clinic and salon pack) — generated by scripts/generate.mjs, do not edit by hand.
# One-click deploy on a Hostinger VPS (Docker Manager), or: docker compose -f packs/clinic.yml up -d
#
# Without a domain: open http://YOUR-SERVER-IP for the start page; each tool has its own port.
# With a domain:    point *.example.com and example.com at the server, set DOMAIN=example.com,
#                   and every tool gets https://<name>.example.com with automatic certificates.
#
# Tools: kashf (clinic., :8096), mawid (book., :8083), dor (queue., :8089), takyeem (reviews., :8093), wakeel (chat., :8081), hader (team., :8090)
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - kashf
      - mawid
      - dor
      - takyeem
      - wakeel
      - hader
    environment:
      - DOMAIN=${DOMAIN:-}
      - ACME_EMAIL=${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8096:8096"
      - "8083:8083"
      - "8089:8089"
      - "8093:8093"
      - "8081:8081"
      - "8090:8090"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /srv
        cat > /srv/index.html <<'HTML'
        <!DOCTYPE html>
        <html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ouda</title>
        <style>
        :root{--bg:#F6F5F2;--card:#fff;--ink:#1B1A17;--muted:#6B6760;--line:#E4E1DA;--c:#0F766E;color-scheme:light}
        @media (prefers-color-scheme:dark){:root{--bg:#141412;--card:#1D1C19;--ink:#ECEAE4;--muted:#A19D94;--line:#32302B;--c:#2DD4BF;color-scheme:dark}}
        *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI","Noto Sans Arabic",Tahoma,system-ui,sans-serif;padding:32px 16px}
        main{max-width:920px;margin:0 auto;display:grid;gap:20px}h1{margin:0;font-size:1.8rem}p{margin:0;color:var(--muted)}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
        a.app{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit}
        a.app:hover{border-color:var(--c)}a.app span{font-size:1.8rem;grid-row:span 2}a.app b{text-transform:capitalize}a.app small{color:var(--muted)}
        .note{font-size:.9rem}code{font-size:.85rem}
        </style></head><body><main>
        <h1>عُدّة · Ouda</h1>
        <p>افتح كل أداة واعمل كلمة السر بتاعتها. Open each tool and create its password.</p>
        <div class="grid" id="apps"></div>
        <p class="note">لو عندك دومين، حط <code>DOMAIN</code> في إعدادات الحاوية، وكل أداة هتشتغل على subdomain بشهادة HTTPS تلقائي. With a domain, set <code>DOMAIN</code> and every tool gets its own HTTPS subdomain.</p>
        </main>
        <script>
        var APPS = [{"id":"kashf","sub":"clinic","port":8096,"icon":"🩺","en":"Patient records and prescriptions for small clinics","ar":"ملفات المرضى والروشتات للعيادات"},{"id":"mawid","sub":"book","port":8083,"icon":"📅","en":"Your own booking page","ar":"صفحة حجز مواعيد"},{"id":"dor","sub":"queue","port":8089,"icon":"🎫","en":"Virtual queue: customers take a number by QR and wait anywhere","ar":"طابور ذكي: العميل ياخد رقم بـ QR ويستنى في أي حتة"},{"id":"takyeem","sub":"reviews","port":8093,"icon":"⭐","en":"Google reviews: ask every customer by QR, hear complaints privately first","ar":"تقييمات جوجل: اطلب التقييم من كل عميل بـ QR واسمع الشكوى الأول"},{"id":"wakeel","sub":"chat","port":8081,"icon":"🤖","en":"AI customer service on WhatsApp, Instagram, Messenger, Telegram and your website","ar":"موظف ذكاء اصطناعي بيرد على واتساب وإنستجرام وماسنجر وتليجرام وموقعك"},{"id":"hader","sub":"team","port":8090,"icon":"⏱️","en":"Staff attendance by QR, leave and payroll","ar":"حضور وانصراف الموظفين بـ QR وإجازات ومرتبات"}];
        var h = location.hostname;
        var named = !/^[0-9.]+$$/.test(h) && h.indexOf(':') < 0 && h !== 'localhost';
        document.getElementById('apps').innerHTML = APPS.map(function (a) {
          var url = named ? 'https://' + a.sub + '.' + h + '/' : 'http://' + h + ':' + a.port + '/';
          return '<a class="app" href="' + url + '"><span>' + a.icon + '</span><b>' + a.id + '</b><small>' + a.ar + '<br>' + a.en + '</small></a>';
        }).join('');
        </script></body></html>
        HTML
        if [ -n "$$ACME_EMAIL" ]; then printf '{
        	email %s
        }
        ' "$$ACME_EMAIL" > /etc/caddy/Caddyfile; else : > /etc/caddy/Caddyfile; fi
        cat >> /etc/caddy/Caddyfile <<'CADDY'
        :80 {
        	root * /srv
        	file_server
        }
        :8096 {
        	reverse_proxy kashf:3000
        }
        :8083 {
        	reverse_proxy mawid:3000
        }
        :8089 {
        	reverse_proxy dor:3000
        }
        :8093 {
        	reverse_proxy takyeem:3000
        }
        :8081 {
        	reverse_proxy wakeel:3000
        }
        :8090 {
        	reverse_proxy hader:3000
        }
        CADDY
        if [ -n "$$DOMAIN" ]; then
        cat >> /etc/caddy/Caddyfile <<'CADDY'
        {$$DOMAIN} {
        	root * /srv
        	file_server
        }
        clinic.{$$DOMAIN} {
        	reverse_proxy kashf:3000
        }
        book.{$$DOMAIN} {
        	reverse_proxy mawid:3000
        }
        queue.{$$DOMAIN} {
        	reverse_proxy dor:3000
        }
        reviews.{$$DOMAIN} {
        	reverse_proxy takyeem:3000
        }
        chat.{$$DOMAIN} {
        	reverse_proxy wakeel:3000
        }
        team.{$$DOMAIN} {
        	reverse_proxy hader:3000
        }
        CADDY
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  kashf:
    image: ghcr.io/mashraf1997/kashf:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - DEMO_MODE=${DEMO_MODE:-false}
    volumes:
      - kashf-data:/data
    expose:
      - "3000"

  mawid:
    image: ghcr.io/mashraf1997/mawid:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SETUP_CODE=${SETUP_CODE:-}
      - DEMO_MODE=${DEMO_MODE:-false}
    volumes:
      - mawid-data:/data
    expose:
      - "3000"

  dor:
    image: ghcr.io/mashraf1997/dor:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - DEMO_MODE=${DEMO_MODE:-false}
    volumes:
      - dor-data:/data
    expose:
      - "3000"

  takyeem:
    image: ghcr.io/mashraf1997/takyeem:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - DEMO_MODE=${DEMO_MODE:-false}
    volumes:
      - takyeem-data:/data
    expose:
      - "3000"

  wakeel:
    image: ghcr.io/mashraf1997/wakeel:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - DEMO_MODE=${DEMO_MODE:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - wakeel-data:/data
    expose:
      - "3000"

  hader:
    image: ghcr.io/mashraf1997/hader:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - DEMO_MODE=${DEMO_MODE:-false}
    volumes:
      - hader-data:/data
    expose:
      - "3000"

volumes:
  caddy-data:
  caddy-config:
  kashf-data:
  mawid-data:
  dor-data:
  takyeem-data:
  wakeel-data:
  hader-data:
