# Ouda (Restaurant and café pack) — generated by scripts/generate.mjs, do not edit by hand.
# One-click deploy on a Hostinger VPS (Docker Manager), or: docker compose -f packs/cafe.yml up -d
#
# Without a domain: open http://YOUR-SERVER-IP for the start page; each tool has its own port.
# With a domain:    point *.example.com and example.com at the server, set DOMAIN=example.com,
#                   and every tool gets https://<name>.example.com with automatic certificates.
#
# Tools: dukkan (shop., :8082), makhzan (pos., :8095), khatm (stamps., :8085), takyeem (reviews., :8093), hamla (campaigns., :8098), raseed (cash., :8091), nashr (posts., :8084)
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - dukkan
      - makhzan
      - khatm
      - takyeem
      - hamla
      - raseed
      - nashr
    environment:
      - DOMAIN=${DOMAIN:-}
      - ACME_EMAIL=${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8082:8082"
      - "8095:8095"
      - "8085:8085"
      - "8093:8093"
      - "8098:8098"
      - "8091:8091"
      - "8084:8084"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /srv
        cat > /srv/index.html <<'HTML'
        <!DOCTYPE html>
        <html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ouda</title>
        <style>
        :root{--bg:#F6F5F2;--card:#fff;--ink:#1B1A17;--muted:#6B6760;--line:#E4E1DA;--c:#0F766E;color-scheme:light}
        @media (prefers-color-scheme:dark){:root{--bg:#141412;--card:#1D1C19;--ink:#ECEAE4;--muted:#A19D94;--line:#32302B;--c:#2DD4BF;color-scheme:dark}}
        *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI","Noto Sans Arabic",Tahoma,system-ui,sans-serif;padding:32px 16px}
        main{max-width:920px;margin:0 auto;display:grid;gap:20px}h1{margin:0;font-size:1.8rem}p{margin:0;color:var(--muted)}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
        a.app{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit}
        a.app:hover{border-color:var(--c)}a.app span{font-size:1.8rem;grid-row:span 2}a.app b{text-transform:capitalize}a.app small{color:var(--muted)}
        .note{font-size:.9rem}code{font-size:.85rem}
        </style></head><body><main>
        <h1>عُدّة · Ouda</h1>
        <p>افتح كل أداة واعمل كلمة السر بتاعتها. Open each tool and create its password.</p>
        <div class="grid" id="apps"></div>
        <p class="note">لو عندك دومين، حط <code>DOMAIN</code> في إعدادات الحاوية، وكل أداة هتشتغل على subdomain بشهادة HTTPS تلقائي. With a domain, set <code>DOMAIN</code> and every tool gets its own HTTPS subdomain.</p>
        </main>
        <script>
        var APPS = [{"id":"dukkan","sub":"shop","port":8082,"icon":"🛒","en":"WhatsApp ordering store and QR menu","ar":"متجر طلبات على واتساب ومنيو QR"},{"id":"makhzan","sub":"pos","port":8095,"icon":"📦","en":"Inventory and point of sale with barcodes","ar":"مخزن وكاشير بالباركود"},{"id":"khatm","sub":"stamps","port":8085,"icon":"☕","en":"Digital loyalty stamp card","ar":"كارت ولاء ديجيتال بالأختام"},{"id":"takyeem","sub":"reviews","port":8093,"icon":"⭐","en":"Google reviews: ask every customer by QR, hear complaints privately first","ar":"تقييمات جوجل: اطلب التقييم من كل عميل بـ QR واسمع الشكوى الأول"},{"id":"hamla","sub":"campaigns","port":8098,"icon":"💬","en":"WhatsApp campaigns through the official API, with consent and unsubscribe","ar":"حملات واتساب بالـ API الرسمي، بموافقة العميل وإلغاء اشتراك"},{"id":"raseed","sub":"cash","port":8091,"icon":"💰","en":"Cash book and customer credit for shops","ar":"دفتر الخزنة والشُكُك للمحلات"},{"id":"nashr","sub":"posts","port":8084,"icon":"📣","en":"AI-written social media posts, published on schedule","ar":"بوستات سوشيال بالذكاء الاصطناعي ونشر تلقائي"}];
        var h = location.hostname;
        var named = !/^[0-9.]+$$/.test(h) && h.indexOf(':') < 0 && h !== 'localhost';
        document.getElementById('apps').innerHTML = APPS.map(function (a) {
          var url = named ? 'https://' + a.sub + '.' + h + '/' : 'http://' + h + ':' + a.port + '/';
          return '<a class="app" href="' + url + '"><span>' + a.icon + '</span><b>' + a.id + '</b><small>' + a.ar + '<br>' + a.en + '</small></a>';
        }).join('');
        </script></body></html>
        HTML
        if [ -n "$$ACME_EMAIL" ]; then printf '{
        	email %s
        }
        ' "$$ACME_EMAIL" > /etc/caddy/Caddyfile; else : > /etc/caddy/Caddyfile; fi
        cat >> /etc/caddy/Caddyfile <<'CADDY'
        :80 {
        	root * /srv
        	file_server
        }
        :8082 {
        	reverse_proxy dukkan:3000
        }
        :8095 {
        	reverse_proxy makhzan:3000
        }
        :8085 {
        	reverse_proxy khatm:3000
        }
        :8093 {
        	reverse_proxy takyeem:3000
        }
        :8098 {
        	reverse_proxy hamla:3000
        }
        :8091 {
        	reverse_proxy raseed:3000
        }
        :8084 {
        	reverse_proxy nashr:3000
        }
        CADDY
        if [ -n "$$DOMAIN" ]; then
        cat >> /etc/caddy/Caddyfile <<'CADDY'
        {$$DOMAIN} {
        	root * /srv
        	file_server
        }
        shop.{$$DOMAIN} {
        	reverse_proxy dukkan:3000
        }
        pos.{$$DOMAIN} {
        	reverse_proxy makhzan:3000
        }
        stamps.{$$DOMAIN} {
        	reverse_proxy khatm:3000
        }
        reviews.{$$DOMAIN} {
        	reverse_proxy takyeem:3000
        }
        campaigns.{$$DOMAIN} {
        	reverse_proxy hamla:3000
        }
        cash.{$$DOMAIN} {
        	reverse_proxy raseed:3000
        }
        posts.{$$DOMAIN} {
        	reverse_proxy nashr:3000
        }
        CADDY
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  dukkan:
    image: ghcr.io/mashraf1997/dukkan:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SETUP_CODE=${SETUP_CODE:-}
      - DEMO_MODE=${DEMO_MODE:-false}
    volumes:
      - dukkan-data:/data
    expose:
      - "3000"

  makhzan:
    image: ghcr.io/mashraf1997/makhzan:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - DEMO_MODE=${DEMO_MODE:-false}
    volumes:
      - makhzan-data:/data
    expose:
      - "3000"

  khatm:
    image: ghcr.io/mashraf1997/khatm:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - DEMO_MODE=${DEMO_MODE:-false}
    volumes:
      - khatm-data:/data
    expose:
      - "3000"

  takyeem:
    image: ghcr.io/mashraf1997/takyeem:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - DEMO_MODE=${DEMO_MODE:-false}
    volumes:
      - takyeem-data:/data
    expose:
      - "3000"

  hamla:
    image: ghcr.io/mashraf1997/hamla:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - DEMO_MODE=${DEMO_MODE:-false}
    volumes:
      - hamla-data:/data
    expose:
      - "3000"

  raseed:
    image: ghcr.io/mashraf1997/raseed:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - DEMO_MODE=${DEMO_MODE:-false}
    volumes:
      - raseed-data:/data
    expose:
      - "3000"

  nashr:
    image: ghcr.io/mashraf1997/nashr:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - DEMO_MODE=${DEMO_MODE:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - nashr-data:/data
    expose:
      - "3000"

volumes:
  caddy-data:
  caddy-config:
  dukkan-data:
  makhzan-data:
  khatm-data:
  takyeem-data:
  hamla-data:
  raseed-data:
  nashr-data:
